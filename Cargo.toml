[package]
name = "sumi-pdf"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "SumiPDF"
path = "src/main.rs"

[dependencies]
lopdf = { version = "0.47", default-features = false }
memchr = "2"
time = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows = { version = "0.62.2", features = ["Data_Pdf", "Foundation", "Storage_Streams", "Graphics_Imaging", "Win32_System_WinRT", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com",
    "Win32_Security_Cryptography", "Win32_Security_Cryptography_UI", "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
