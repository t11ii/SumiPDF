[package]
name = "sumi-pdf"
version = "0.9.6"
edition = "2024"
publish = false

[[bin]]
name = "SumiPDF"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
lopdf = { version = "0.47", default-features = false }
memchr = "2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
zeroize = "1.8"
tempfile = "3"
windows = { version = "0.62.2", features = ["Data_Pdf", "Foundation", "Storage_Streams", "Graphics_Imaging", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_System_Com",
    "Win32_Security_Cryptography", "Win32_Security_Cryptography_UI", "Win32_System_SystemInformation", "Win32_System_Console",
    "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Ole", "Win32_System_Variant"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
