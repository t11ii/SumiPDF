name: Windows startup capture diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  startup:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get previous release
        uses: actions/checkout@v6
        with:
          ref: 4f35cc619b121337118f9e250285b4bedb104ef3
          path: startup-baseline
          sparse-checkout: dist
          persist-credentials: false
      - name: Compare the exact tested Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46135080737 --name SumiPDF-Windows-x64 --dir ./candidate
          if ($LASTEXITCODE) { throw 'Could not download the checked build.' }
          tar.exe -xf ./candidate/SumiPDFWindowsX64.zip -C ./candidate
          if ($LASTEXITCODE) { throw 'Could not unpack the checked build.' }
          ./tests/startup.ps1 -Executable ./candidate/SumiPDF.exe -BaselineExecutable ./startup-baseline/dist/SumiPDF.exe -CsvPath ./SumiPDF-startup.csv
      - uses: actions/upload-artifact@v7
        with:
          name: SumiPDF-startup-diagnostic
          path: SumiPDF-startup.csv
          if-no-files-found: error
