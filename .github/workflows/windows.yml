name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_find:
        description: Compare repeated Find latency with v0.9.0 on the same Windows runner
        type: boolean
        default: false
      compare_startup:
        description: Compare startup with v0.9.3 on the same Windows runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  viewer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get the v0.9.0 Find baseline
        if: inputs.compare_find
        uses: actions/checkout@v6
        with:
          ref: b34b33e22e666d0fbbcec382c11ed0c3d9fa2522
          path: find-baseline
          sparse-checkout: dist
          persist-credentials: false
      - name: Get the v0.9.3 startup baseline
        if: inputs.compare_startup
        uses: actions/checkout@v6
        with:
          ref: dbaa2fa7e4c7fca587f7f5a9efc9a66e4cf8d368
          path: startup-baseline
          sparse-checkout: dist
          persist-credentials: false
      - name: Compare startup with v0.9.3
        if: inputs.compare_startup
        shell: pwsh
        run: ./tests/startup.ps1 -Executable ./dist/SumiPDF.exe -BaselineExecutable ./startup-baseline/dist/SumiPDF.exe -CsvPath ./SumiPDF-startup.csv
      - uses: actions/upload-artifact@v7
        if: inputs.compare_startup
        with:
          name: SumiPDF-startup
          path: SumiPDF-startup.csv
          if-no-files-found: error
      - name: Check the executable distributed in the release ZIP
        shell: pwsh
        env:
          SUMIPDF_FIND_BASELINE_EXE: ${{ inputs.compare_find && 'find-baseline/dist/SumiPDF.exe' || '' }}
        run: ./tests/smoke.ps1 -Executable ./dist/SumiPDF.exe -ScreenshotPath ./SumiPDF-reading.png
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test PDF signing and native rendering
        run: cargo +stable test --locked
      - name: Build portable viewer
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +stable build --release --locked --target x86_64-pc-windows-msvc
      - name: Open a PDF and navigate in the release viewer
        shell: pwsh
        run: ./tests/smoke.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/SumiPDF.exe
      - uses: actions/upload-artifact@v7
        with:
          name: SumiPDF-reading-preview
          path: SumiPDF-reading.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: SumiPDF-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/SumiPDF.exe
          if-no-files-found: error
