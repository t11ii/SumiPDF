<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>透かしデザイナー · SumiPDF</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #232725;
      --muted: #565e59;
      --line: #d4d7cf;
      --paper: #faf9f5;
      --green: #264c3b;
      font-family: Inter, "Yu Gothic UI", Meiryo, sans-serif;
      color: var(--ink);
      background: #f0f1eb;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    header {
      height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 clamp(20px, 5vw, 78px);
      gap: 12px;
      background: var(--paper);
    }
    .logo {
      font: italic bold 26px Georgia;
      color: white;
      background: var(--green);
      width: 34px;
      height: 34px;
      text-align: center;
      border-radius: 7px;
    }
    .brand {
      font-weight: 740;
      letter-spacing: 0.01em;
    }
    main {
      max-width: 1090px;
      margin: clamp(25px, 5vw, 68px) auto;
      padding: 0 25px;
    }
    h1 {
      font-family: "Yu Mincho", serif;
      font-size: clamp(30px, 4.6vw, 54px);
      letter-spacing: -0.04em;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 16px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      margin: 0;
    }
    .studio {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(285px, 0.78fr);
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 12px;
      overflow: hidden;
      margin: 25px 0;
    }
    .stage {
      display: grid;
      place-items: center;
      position: relative;
      min-height: 325px;
      background-color: #e4e7de;
      background-image: radial-gradient(#bac1b6 1px, transparent 1px);
      background-size: 15px 15px;
      padding: 30px;
    }
    .artboard {
      background: white;
      border-radius: 3px;
      width: min(100%, 355px);
      aspect-ratio: 1;
      box-shadow: 0 6px 20px #27372318;
      display: block;
    }
    #drawing.pen {
      cursor: crosshair;
      touch-action: none;
    }
    .controls {
      padding: 24px;
      display: grid;
      gap: 15px;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 650;
    }
    input,
    select,
    button {
      font: inherit;
    }
    input[type="text"],
    select {
      height: 38px;
      border: 1px solid #b3b9b0;
      border-radius: 5px;
      padding: 4px 8px;
      background: white;
      color: var(--ink);
      width: 100%;
    }
    button {
      border: 1px solid #a3aaa1;
      background: transparent;
      border-radius: 6px;
      color: var(--ink);
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    button:hover:enabled {
      background: #e8ebe4;
    }
    button[aria-pressed="true"] {
      background: #dce9df;
      border-color: var(--green);
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid #d39e4b;
      outline-offset: 2px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color {
      height: 35px;
      width: 64px;
      background: white;
      border: 1px solid #b3b9b0;
      border-radius: 5px;
      padding: 3px;
    }
    .primary {
      background: var(--green);
      border-color: var(--green);
      color: white;
      font-weight: 650;
    }
    .primary:hover:enabled {
      background: #183c2b;
    }
    .actions {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    .proof {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 1fr);
      align-items: center;
      gap: 24px;
      padding: 0 0 25px;
    }
    .proof h2 {
      margin-bottom: 5px;
    }
    .example {
      min-height: 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--line);
      padding: 16px;
      position: relative;
      isolation: isolate;
    }
    .example svg {
      position: absolute;
      z-index: -1;
      inset: 6%;
      width: 88%;
      height: 88%;
      opacity: 0.15;
    }
    .example strong {
      font:
        23px Georgia,
        "Yu Mincho",
        serif;
    }
    .example small {
      font-size: 12px;
    }
    .status {
      min-height: 1.4em;
      font-size: 13px;
    }
    @media (max-width: 680px) {
      main {
        padding: 0 16px;
      }
      .studio,
      .proof {
        grid-template-columns: 1fr;
      }
      .stage {
        min-height: 230px;
        padding: 16px;
      }
      .artboard {
        width: min(72vw, 280px);
      }
      .controls {
        padding: 18px;
      }
      .proof {
        gap: 10px;
      }
    }
  </style>
  <header>
    <span class="logo" aria-hidden="true">S</span>
    <span class="brand">SumiPDF</span>
  </header>
  <main>
    <h1>透かしデザイナー</h1>
    <p>署名の背景に使う印を作り、透過 PNG として保存できます。</p>
    <div class="studio">
      <div class="stage">
        <svg
          id="drawing"
          class="artboard"
          viewBox="0 0 512 512"
          aria-label="デザインの編集面"
        >
          <g id="art"></g>
        </svg>
      </div>
      <div class="controls">
        <label>
          印の文字
          <input id="word" type="text" value="墨" maxlength="24" />
        </label>
        <div class="pair">
          <label>
            書体
            <select id="font">
              <option value="serif">明朝</option>
              <option value="sans-serif">ゴシック</option>
            </select>
          </label>
          <label>
            外枠
            <select id="frame">
              <option value="circle">丸</option>
              <option value="square">角丸</option>
              <option value="none">なし</option>
            </select>
          </label>
        </div>
        <div class="pair">
          <label>
            インクの色
            <input id="color" class="color" type="color" value="#a44839" />
          </label>
          <label>
            ペンの太さ
            <select id="width">
              <option value="5">細</option>
              <option value="12" selected>中</option>
              <option value="22">太</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="pen" type="button" aria-pressed="false">
            手描きペン
          </button>
          <button id="undo" type="button" disabled>一筆戻す</button>
        </div>
        <div class="row actions">
          <button class="primary" id="png" type="button">PNG を保存</button>
          <button id="svg" type="button">編集用 SVG を保存</button>
        </div>
        <p role="status" class="status" id="message"></p>
      </div>
    </div>
    <section class="proof">
      <div>
        <h2>署名での見え方</h2>
        <p>保存した PNG を SumiPDF の署名画面で選択してください。</p>
      </div>
      <div class="example" aria-label="署名の表示例">
        <svg viewBox="0 0 512 512" aria-hidden="true"><use href="#art" /></svg>
        <strong>署名者名</strong>
        <small>
          Digitally signed by
          <br />
          署名者名
          <br />
          Date: 2026-01-01 09:00:00 UTC
        </small>
      </div>
    </section>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const ns = "http://www.w3.org/2000/svg";
    const strokes = [];
    let current = null,
      pen = false;
    function element(tag, attrs) {
      const node = document.createElementNS(ns, tag);
      for (const [key, value] of Object.entries(attrs))
        node.setAttribute(key, String(value));
      return node;
    }
    function redraw() {
      const art = $("art"),
        ink = $("color").value;
      art.replaceChildren();
      const outline = { fill: "none", stroke: ink, "stroke-width": 12 };
      if ($("frame").value === "circle")
        art.append(element("circle", { ...outline, cx: 256, cy: 256, r: 202 }));
      else if ($("frame").value === "square")
        art.append(
          element("rect", {
            ...outline,
            x: 62,
            y: 62,
            width: 388,
            height: 388,
            rx: 35,
          }),
        );
      const word = $("word").value.trim();
      if (word) {
        const font =
          $("font").value === "serif"
            ? '"Yu Mincho","Hiragino Mincho ProN",serif'
            : '"Yu Gothic","Hiragino Sans",sans-serif';
        const label = element("text", {
          x: 256,
          y: 256,
          fill: ink,
          "font-family": font,
          "font-weight": 600,
          "font-size": 208,
          "text-anchor": "middle",
          "dominant-baseline": "central",
        });
        label.textContent = word;
        art.append(label);
        const extent = label.getComputedTextLength();
        if (extent > 344)
          label.setAttribute("font-size", String((208 * 344) / extent));
      }
      for (const stroke of strokes) {
        const points = stroke.pts;
        if (points.length === 1)
          art.append(
            element("circle", {
              cx: points[0][0],
              cy: points[0][1],
              r: stroke.width / 2,
              fill: stroke.color,
            }),
          );
        else
          art.append(
            element("polyline", {
              points: points.map((p) => p.join(",")).join(" "),
              stroke: stroke.color,
              "stroke-width": stroke.width,
              "stroke-linejoin": "round",
              "stroke-linecap": "round",
              fill: "none",
            }),
          );
      }
      $("undo").disabled = !strokes.length;
    }
    for (const id of ["word", "frame", "font", "color"])
      $(id).addEventListener("input", redraw);
    $("pen").onclick = () => {
      pen = !pen;
      $("pen").setAttribute("aria-pressed", String(pen));
      $("drawing").classList.toggle("pen", pen);
      $("message").textContent = pen ? "編集面をドラッグして描けます。" : "";
    };
    function point(e) {
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(
        $("drawing").getScreenCTM().inverse(),
      );
      return [p.x, p.y].map(
        (v) => Math.round(Math.min(512, Math.max(0, v)) * 10) / 10,
      );
    }
    $("drawing").onpointerdown = (e) => {
      if (!pen || current || e.button !== 0) return;
      $("drawing").setPointerCapture(e.pointerId);
      current = {
        id: e.pointerId,
        color: $("color").value,
        width: Number($("width").value),
        pts: [point(e)],
      };
      strokes.push(current);
      redraw();
    };
    $("drawing").onpointermove = (e) => {
      if (current?.id === e.pointerId) {
        current.pts.push(point(e));
        redraw();
      }
    };
    $("drawing").onlostpointercapture = () => {
      current = null;
    };
    $("undo").onclick = () => {
      strokes.pop();
      redraw();
    };
    function vector() {
      const root = element("svg", {
        viewBox: "0 0 512 512",
        width: 512,
        height: 512,
      });
      root.append($("art").cloneNode(true));
      return new Blob([new XMLSerializer().serializeToString(root)], {
        type: "image/svg+xml;charset=utf-8",
      });
    }
    function download(blob, name) {
      const url = URL.createObjectURL(blob),
        link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
    $("svg").onclick = () => {
      download(vector(), "signatureWatermark.svg");
      $("message").textContent = "編集用 SVG を書き出しました。";
    };
    $("png").onclick = async () => {
      const url = URL.createObjectURL(vector());
      try {
        const img = new Image();
        img.src = url;
        await img.decode();
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        canvas.getContext("2d").drawImage(img, 0, 0);
        const png = await new Promise((resolve) =>
          canvas.toBlob(resolve, "image/png"),
        );
        if (!png) throw new Error();
        download(png, "signatureWatermark.png");
        $("message").textContent = "透過 PNG を書き出しました。";
      } catch {
        $("message").textContent = "PNG を書き出せませんでした。";
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    redraw();
  </script>
</html>
